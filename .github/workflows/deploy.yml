name: Deploy

on:
  workflow_run:
    workflows: ["Container Image"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when the image build succeeded
    if: github.event.workflow_run.conclusion == 'success'
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/daily-report-app' }}
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans

      - name: Post-deployment health check
        if: ${{ env.HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: |
          sleep 20
          curl --fail --max-time 30 --retry 5 --retry-delay 5 \
            "$HEALTHCHECK_URL"
