services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to your GHCR image, e.g. ghcr.io/<owner>/daily-report-app:latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/daily_reports}
      AUTH_URL: ${AUTH_URL:-http://127.0.0.1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - uploads:/app/public/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daily_reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_reports"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:4
    profiles:
      - debug
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
